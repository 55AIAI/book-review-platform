<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Review Platform</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Header -->
  <header class="main-header">
    <div class="header-inner">
      <h1>Book Review Platform</h1>
      <div id="user-info" class="user-info"></div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">

    <!-- Authentication Section -->
    <section id="auth-section" class="section">
      <div class="auth-grid">

        <!-- Register -->
        <div class="card">
          <h2>Create Account</h2>
          <form id="register-form">
            <input type="text" id="reg-username" placeholder="Username" required />
            <input type="email" id="reg-email" placeholder="Email address" required />
            <input type="password" id="reg-password" placeholder="Password (minimum 6 characters)" required />
            <button type="submit" class="primary-btn">Register</button>
          </form>
          <p class="form-message" id="register-message"></p>
        </div>

        <!-- Login -->
        <div class="card">
          <h2>Sign In</h2>
          <form id="login-form">
            <input type="email" id="login-email" placeholder="Email address" required />
            <input type="password" id="login-password" placeholder="Password" required />
            <button type="submit" class="primary-btn">Login</button>
          </form>
          <p class="form-message" id="login-message"></p>
        </div>

      </div>
    </section>

    <!-- Dashboard -->
    <section id="dashboard-section" class="section hidden">

      <!-- Profile -->
      <div class="card">
        <h2>My Profile</h2>

        <div id="profile-display"></div>

        <form id="profile-form" class="hidden">
          <input type="text" id="profile-username" placeholder="Username" />
          <input type="email" id="profile-email" placeholder="Email address" />
          <div class="btn-row">
            <button type="submit" class="primary-btn">Save</button>
            <button type="button" class="secondary-btn" onclick="cancelProfileEdit()">Cancel</button>
          </div>
        </form>

        <button id="edit-profile-btn" class="secondary-btn" onclick="editProfile()">Edit Profile</button>
      </div>

      <!-- Book Search -->
      <div class="card">
        <h2>Search Books</h2>
        <form id="search-form" class="search-form">
          <input type="text" id="search-query" placeholder="Search by title or author" required />
          <button type="submit" class="primary-btn">Search</button>
        </form>
        <div id="search-results" class="grid"></div>
        <p class="muted">Data provided by external book APIs</p>
      </div>

      <!-- Saved Books -->
      <div class="card">
        <h2>My Saved Books</h2>
        <button class="secondary-btn" onclick="loadMyBooks()">Refresh</button>
        <div id="my-books" class="grid"></div>
      </div>

      <!-- Reviews -->
      <div class="card">
        <h2>My Reviews</h2>
        <button class="secondary-btn" onclick="loadMyReviews()">Refresh</button>
        <div id="my-reviews"></div>
      </div>

    </section>
  </main>

  <!-- Review Modal -->
  <div id="review-modal" class="modal hidden">
    <div class="modal-content">
      <button class="modal-close" onclick="closeReviewModal()">×</button>
      <h2 id="modal-title">Add Review</h2>

      <form id="review-form">
        <input type="hidden" id="review-id" />
        <input type="hidden" id="review-book-id" />

        <label for="review-rating">Rating</label>
        <select id="review-rating" required>
          <option value="">Select rating</option>
          <option value="1">1 – Poor</option>
          <option value="2">2 – Fair</option>
          <option value="3">3 – Good</option>
          <option value="4">4 – Very Good</option>
          <option value="5">5 – Excellent</option>
        </select>

        <label for="review-text">Review</label>
        <textarea id="review-text" placeholder="Write your review here..." rows="4" required></textarea>

        <button type="submit" class="primary-btn">Submit Review</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
