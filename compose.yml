services:
  mongo:
    image: mongo:7.0
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand({ping:1})']
      interval: 5s
      timeout: 5s
      retries: 15
  app:
    build: .
    ports:
      - '127.0.0.1:5000:5000'
    environment:
      PORT: '5000'
      MONGO_URI: mongodb://mongo:27017/book_review
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    depends_on:
      mongo:
        condition: service_healthy
volumes:
  mongo-data:
